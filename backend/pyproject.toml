[project]
name = "ncshift"
version = "0.2.0"
description = "NCshift : de la facture au paiement. Sprint 2 : extraction Factur-X, score de confiance, jeu d'or."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "imap-tools>=1.10",
    "watchdog>=6.0",
    "arq>=0.26",
    "redis>=5.2",
    "boto3>=1.35",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
