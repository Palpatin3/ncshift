# NCshift : socle sprint 1. Un seul serveur, tout le monde dedans.
# En prod : ce même fichier avec des secrets dans .env et un reverse-proxy HTTPS devant.
# Note : pas de serveur S3 local (MinIO a quitté Docker Hub en septembre 2026) :
# en dev les fichiers bruts vont dans le volume "fichierdata", en prod on branche
# le S3 de Scaleway via STOCKAGE=s3 sans changer le code.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ncshift
      POSTGRES_PASSWORD: ncshift
      POSTGRES_DB: ncshift
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncshift"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &env
      DATABASE_URL: postgresql+psycopg://ncshift:ncshift@db:5432/ncshift
      REDIS_URL: redis://redis:6379/0
      STOCKAGE: local
      STOCKAGE_LOCAL_DIR: /data
      # Canal mail : renseigner pour activer le poller
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      # Canal dossier : monter le volume et renseigner WATCH_FOLDER
      WATCH_FOLDER: ${WATCH_FOLDER:-}
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - fichierdata:/data
      - factures_in:${WATCH_FOLDER_DIR:-/var/ncshift/in}

  worker:
    build: ./backend
    command: arq app.worker.tasks.WorkerSettings
    environment: *env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - fichierdata:/data
      - factures_in:${WATCH_FOLDER_DIR:-/var/ncshift/in}

volumes:
  pgdata:
  fichierdata:
  factures_in:
