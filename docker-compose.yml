# NCshift : socle sprint 1. Un seul serveur, tout le monde dedans.
# En prod : ce même fichier avec des secrets dans .env et un reverse-proxy HTTPS devant.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ncshift
      POSTGRES_PASSWORD: ncshift
      POSTGRES_DB: ncshift
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncshift"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    # Création du bucket au démarrage
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c " sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/ncshift;
      exit 0; "

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &env
      DATABASE_URL: postgresql+psycopg://ncshift:ncshift@db:5432/ncshift
      REDIS_URL: redis://redis:6379/0
      STOCKER_S3: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: ncshift
      # Canal mail : renseigner pour activer le poller
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      # Canal dossier : monter le volume et renseigner WATCH_FOLDER
      WATCH_FOLDER: ${WATCH_FOLDER:-}
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - factures_in:${WATCH_FOLDER_DIR:-/var/ncshift/in}

  worker:
    build: ./backend
    command: arq app.worker.tasks.WorkerSettings
    environment: *env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - factures_in:${WATCH_FOLDER_DIR:-/var/ncshift/in}

volumes:
  pgdata:
  miniodata:
  factures_in:
